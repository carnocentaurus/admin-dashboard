<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="search-div">
            <!-- search icon -->
            <input type="search" class="search-input">
        </div>

        <div class="profile-div">
            <!-- notification icon -->
            <img src="" class="profile-image" alt="carnocentaurus profile image">
            <p class="small-username">carnocentaurus</p>
        </div>

        <div class="greetings-div">
            <img src="" class="profile-image" alt="carnocentaurus profile image">
            <p class="hi-there-text">Hi there,</p>
            <p class="big-username">carnocentaurus</p>
        </div>

        <div class="header-buttons-div">
            <button>New</button>
            <button>Upload</button>
            <button>Share</button>
        </div>
    </header>

    <div class="dashboard">
        <div>
            <!-- dashboard icon -->
            <p class="dashboard-text">Dashboard</p>
        </div>

        <div>
            <!-- home icon -->
            <a class="dashboard-items-text">Home</a>
        </div>
        <div>
            <!-- profile icon -->
            <a class="dashboard-items-text">Profile</a>
        </div>
        <div>
            <!-- messages icon -->
            <a class="dashboard-items-text">Messages</a>
        </div>
        <div>
            <!-- history icon -->
            <a class="dashboard-items-text">History</a>
        </div>
        <div>
            <!-- tasks icon -->
            <a class="dashboard-items-text">Tasks</a>
        </div>
        <div>
            <!-- communities icon -->
            <a class="dashboard-items-text">Communities</a>
        </div>

        <div>
            <!-- settings icon -->
            <a class="dashboard-items-text">Settings</a>
        </div>
        <div>
            <!-- support icon -->
            <a class="dashboard-items-text">Support</a>
        </div>
        <div>
            <!-- privacy icon -->
            <a class="dashboard-items-text">Privacy</a>
        </div>
    </div>
    
</body>
</html>
